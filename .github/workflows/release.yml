name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Opens or updates the release PR while changesets are pending, and publishes once it is merged.
      # npm authenticates through the trusted publisher set up for each package, so there is no token.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Release
          commit: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
